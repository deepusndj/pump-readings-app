services:
  - type: web
    name: pump-readings
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OWNER_PASSWORD
        sync: false
      - key: PUMP_DB_PATH
        value: pump_readings.db
